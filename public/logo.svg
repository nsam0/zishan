<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Outer circle with dash/dots effect -->
  <circle cx="50" cy="50" r="46" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="3" />
  <circle cx="50" cy="50" r="41" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="3,2" />
  
  <!-- Inner Globe & Graduation Cap Icon -->
  <circle cx="50" cy="50" r="32" fill="#eff6ff" />
  <ellipse cx="50" cy="50" rx="14" ry="32" fill="none" stroke="#93c5fd" stroke-width="1.2" />
  <line x1="18" y1="50" x2="82" y2="50" stroke="#93c5fd" stroke-width="1.2" />
  
  <!-- Graduation Cap -->
  <polygon points="50,28 72,38 50,48 28,38" fill="url(#grad1)" />
  <polygon points="38,44 38,56 50,62 62,56 62,44 50,50" fill="#1e40af" />
  <line x1="68" y1="40" x2="68" y2="55" stroke="#f59e0b" stroke-width="2" />
  <circle cx="68" cy="57" r="2.5" fill="#f59e0b" />
</svg>
